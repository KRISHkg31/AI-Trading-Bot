[project]
name = "ai-trading-bot"
version = "0.1.0"
description = "AI-powered multi-asset algorithmic trading bot (BRD v1.0)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "ccxt>=4.2",
    "requests>=2.31",
    "pyarrow>=15.0",
]

[project.scripts]
ai-trading-bot = "ai_trading_bot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"